name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ncbi-blast+

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]

    - name: Decompress test files
      run: |
        cd test/Input && gunzip -f *.gz || true

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 shigapass --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 shigapass --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=shigapass --cov-report=xml --cov-report=term-missing

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ncbi-blast+

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]

    - name: Decompress test files
      run: |
        cd test/Input && gunzip -f *.gz || true

    - name: Run integration tests
      run: |
        pytest tests/test_integration.py -v -m integration || true
